[project]
name = "service-manager"
version = "0.1.0"
description = "Service Manager API built with FastAPI"
readme = "readme.MD"
requires-python = "==3.14.*"

dependencies = [
    "aiosmtplib==5.1.2",
    "alembic==1.18.5",
    "amqp==5.3.1",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.14.1",
    "bcrypt==4.0.1",
    "billiard==4.2.4",
    "blinker==1.9.0",
    "celery==5.6.3",
    "certifi==2026.6.17",
    "cffi==2.1.0",
    "click==8.4.2",
    "click-didyoumean==0.3.1",
    "click-plugins==1.1.1.2",
    "click-repl==0.3.0",
    "colorama==0.4.6",
    "cryptography==49.0.0",
    "dnspython==2.8.0",
    "ecdsa==0.19.2",
    "email-validator==2.3.0",
    "et-xmlfile==2.0.0",
    "fastapi==0.139.0",
    "fastapi-mail==1.6.5",
    "greenlet==3.5.3",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "jinja2==3.1.6",
    "kombu==5.6.2",
    "mako==1.3.12",
    "markupsafe==3.0.3",
    "numpy==2.5.1",
    "openpyxl==3.1.5",
    "packaging==26.2",
    "pandas==3.0.3",
    "passlib==1.7.4",
    "prompt-toolkit==3.0.52",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "pyasn1==0.6.3",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pydantic-core==2.46.4",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "python-jose==3.5.0",
    "python-multipart==0.0.32",
    "redis==8.0.1",
    "regex==2026.6.28",
    "rsa==4.9.1",
    "six==1.17.0",
    "sqlalchemy==2.0.51",
    "starlette==1.3.1",
    "typing-inspection==0.4.2",
    "typing-extensions==4.16.0",
    "tzdata==2026.2",
    "tzlocal==5.4.4",
    "uvicorn==0.50.2",
    "vine==5.1.0",
    "wcwidth==0.8.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["alembic", "alembic.*"]
namespaces = false