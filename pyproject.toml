[project]
name = "service-manager"
version = "0.1.0"
description = "Service Manager API built with FastAPI"
readme = "readme.MD"
requires-python = "==3.14.*"

dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.50.2",

    "sqlalchemy==2.0.51",
    "psycopg[binary]==3.3.4",
    "alembic==1.18.5",

    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",

    "python-jose[cryptography]==3.5.0",
    "passlib==1.7.4",
    "bcrypt==4.0.1",

    "python-multipart==0.0.32",
    "email-validator==2.3.0",

    "celery[redis]==5.6.3",
    "redis==8.0.1",

    "fastapi-mail==1.6.5",
    "aiosmtplib==5.1.2",

    "httpx==0.28.1",

    "numpy==2.5.1",
    "pandas==3.0.3",
    "openpyxl==3.1.5",
]

[tool.vercel.scripts]
build = "python -c \"from jose import jwt, JWTError; print('python-jose installed successfully')\""